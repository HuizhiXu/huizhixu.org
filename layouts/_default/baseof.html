<!DOCTYPE html>
<html lang="{{ if eq .Lang "chs" }}zh-CN{{ else }}{{ .Lang }}{{ end }}" itemscope itemtype="http://schema.org/WebPage">
  {{ partial "head.html" . }}
  <body class="antialiased journal-{{ if .IsHome }}home{{ else if .IsPage }}post{{ else }}archive{{ end }}">
    <a class="skip-link" href="#main-content">{{ i18n "skipToContent" }}</a>
    <div class="journal-sheet">
      {{ partial "header.html" . }}
      <div class="journal-layout">
        {{ partial "journal-sidebar.html" . }}
        <main id="main-content" class="journal-main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
      </div>
      {{ partial "footer.html" . }}
    </div>
  </body>
</html>
