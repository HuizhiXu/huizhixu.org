<div id="site-search" class="search-ui fixed inset-0 z-50 overflow-y-auto bg-white dark:bg-gray-800 hidden"
  role="dialog" aria-modal="true" aria-labelledby="search-title"
  data-index-url="{{ (.Site.Home.OutputFormats.Get "JSON").RelPermalink }}"
  data-loading="{{ i18n "searchLoading" }}" data-error="{{ i18n "searchError" }}"
  data-empty="{{ i18n "searchEmpty" }}" data-results="{{ i18n "searchResults" }}">
  <div class="container max-w-3xl mx-auto p-6 md:p-12">
    <div class="flex items-center justify-between my-4">
      <h2 id="search-title" class="text-2xl font-bold">{{ i18n "searchTitle" }}</h2>
      <button type="button" class="p-2 close-search" aria-label="{{ i18n "searchClose" }}">×</button>
    </div>
    <label class="sr-only" for="search-input">{{ i18n "searchTitle" }}</label>
    <input id="search-input" type="search" class="py-2 px-3 w-full dark:text-black border dark:border-transparent"
      placeholder="{{ i18n "searchPlaceholder" }}" autocomplete="off" />
    <p class="search-status my-4" role="status" aria-live="polite"></p>
    <button type="button" class="search-retry underline" hidden>{{ i18n "searchRetry" }}</button>
    <ul class="search-list my-2"></ul>
  </div>
</div>
{{ $fuse := resources.Get "js/fuse.min.js" }}
{{ $search := resources.Get "js/search.js" }}
{{ $js := slice $fuse $search | resources.Concat "js/search-bundle.js" | resources.Minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
