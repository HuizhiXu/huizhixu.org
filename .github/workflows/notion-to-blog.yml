name: Notion To Blog

on:
  workflow_dispatch:
    inputs:
      sync_notion:
        description: 'Export pending Notion articles before deploying'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  notion-to-blog:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_notion && github.ref == 'refs/heads/publish/long-goodbye-v1-20261019'
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      GITHUB_REPO: HuizhiXu/pictures
      GITHUB_BRANCH: master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.CHECKOUT_TOKEN }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Test publishing tools
        run: npm test
      - name: Export Notion pages
        if: github.event_name == 'issues' || inputs.sync_notion
        run: |
          uv run --frozen python - <<'PY'
          import sys, json
          sys.path.insert(0, 'scripts')
          import notion_to_blog as n
          n.require_env()
          target = '3fea221e-f6ab-814b-9675-d0524232839c'
          pending = n.get_notion_pages()
          if len(pending) != 1 or pending[0]['id'] != target:
              raise RuntimeError('Pending list changed; refusing any batch publication')
          page = pending[0]
          filename = ''.join(t['plain_text'] for t in page['properties']['MDFilename']['rich_text'])
          if filename != 'the-long-goodbye-v1.md':
              raise RuntimeError('Unexpected filename')
          # Garden body was verified identical to Creation V1. Do not change the stored relation.
          page['properties']['Article'] = {'rich_text': []}
          entry = n.process_notion_page(page)
          if entry['path'] != 'content/chs/life/the-long-goodbye-v1.md':
              raise RuntimeError('Unexpected content path')
          n.atomic_write(n.REPO_ROOT / '.sync-state/publish.json', json.dumps({'pages': [entry], 'complete': True}, ensure_ascii=False, indent=2))
          print('Exported exactly one V1 article; Notion callback intentionally deferred until live verification.')
          PY
      - name: Build and validate site
        run: |
          npm run build
          uv run --frozen python scripts/check_site.py public
      - name: Validate exported articles
        if: github.event_name == 'issues' || inputs.sync_notion
        run: uv run --frozen python scripts/check_site.py public --manifest .sync-state/publish.json
      - name: Commit exported content
        if: github.event_name == 'issues' || inputs.sync_notion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/chs/life/the-long-goodbye-v1.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish blog content from Notion"
          fi
          git push origin HEAD:master
      - name: Disable Jekyll
        run: touch public/.nojekyll
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CHECKOUT_TOKEN }}
          publish_dir: ./public
          external_repository: HuizhiXu/huizhixu.github.io
          publish_branch: master
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          enable_jekyll: false
      - name: Preserve publishing manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-manifest
          path: .sync-state/publish.json
          include-hidden-files: true
          if-no-files-found: ignore
