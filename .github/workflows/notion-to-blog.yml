name: Notion To Blog

on:
  workflow_dispatch:
    inputs:
      sync_notion:
        description: 'Export all pending Garden articles before deploying (legacy mode)'
        type: boolean
        default: false
      source_page_id:
        description: 'Publish exactly one Garden page UUID (must be in Publish or Update state)'
        type: string
        required: false
        default: ''
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  notion-to-blog:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && contains(github.event.issue.title, 'notion-ci'))
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      GITHUB_REPO: HuizhiXu/pictures
      GITHUB_BRANCH: master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.CHECKOUT_TOKEN }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Test publishing tools
        run: npm test
      - name: Export Notion pages
        if: github.event_name == 'issues' || inputs.sync_notion || inputs.source_page_id != ''
        env:
          SOURCE_PAGE_ID: ${{ inputs.source_page_id }}
        run: |
          if [ -n "$SOURCE_PAGE_ID" ]; then
            if ! [[ "$SOURCE_PAGE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo 'source_page_id must be a UUID' >&2
              exit 1
            fi
            uv run --frozen python scripts/notion_to_blog.py --page-id "$SOURCE_PAGE_ID"
          else
            uv run --frozen python scripts/notion_to_blog.py
          fi
      - name: Build and validate site
        run: |
          npm run build
          uv run --frozen python scripts/check_site.py public
      - name: Validate exported articles
        if: github.event_name == 'issues' || inputs.sync_notion || inputs.source_page_id != ''
        run: uv run --frozen python scripts/check_site.py public --manifest .sync-state/publish.json
      - name: Commit exported content
        if: github.event_name == 'issues' || inputs.sync_notion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/
          if ! git diff --cached --quiet; then
            git commit -m "Publish blog content from Notion"
          fi
          git push origin HEAD:master
      - name: Disable Jekyll
        run: touch public/.nojekyll
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CHECKOUT_TOKEN }}
          publish_dir: ./public
          external_repository: HuizhiXu/huizhixu.github.io
          publish_branch: master
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          enable_jekyll: false
      - name: Mark deployed pages Published
        if: github.event_name == 'issues' || inputs.sync_notion
        run: uv run --frozen python scripts/notion_to_blog.py --finalize
      - name: Preserve publishing manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-manifest
          path: .sync-state/publish.json
          include-hidden-files: true
          if-no-files-found: ignore
