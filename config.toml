baseURL = "https://huizhixu.github.io"
metaDataFormat = "yaml"
title = "HuizhiXu 的个人博客"
theme = "blist"
relativeURLs = true
canonifyURLs = true

isCJKLanguage = true
DefaultContentLanguage = "chs"
DefaultContentLanguageInSubdir = false

[author]
  name = "HuizhiXu"

[languages]
  [languages.chs]
    contentDir = 'content/chs'
    languageName = '中文 (简体)'
    title = '徐慧志的个人博客'
    weight = 1
    [languages.chs.params]
      brandName = "Sophia"
      introTitle = "沿着好奇心，去往更远的地方。"
      introSubtitle = "写下遇见的问题、暂时的答案，以及一个又一个意外出现的兔子洞。"
      introPhoto = "/picture.jpg"
      logo = "/huizhi-mark-logo-garden.png"
      reading_speed = 400
    [[languages.chs.menu.main]]
      name = "生活"
      url = "/life/"
      weight = 2
    [[languages.chs.menu.main]]
      name = "关于"
      url = "/page/about/"
      weight = 3
    [[languages.chs.menu.main]]
      name = "技术"
      url = "/know_how/"
      weight = 1
    [[languages.chs.menu.main]]
      name = "分类"
      url = "/tags/"
      weight = 5

  [languages.en]
    contentDir = 'content/en'
    languageName = 'English'
    title = 'PoirotMore'
    weight = 2
    [languages.en.params]
      brandName = "Sophia"
      introTitle = "Follow curiosity a little further."
      introSubtitle = "Notes on the questions I meet, the answers I hold for now, and the rabbit holes that appear along the way."
      introPhoto = "/picture.jpg"
      logo = "/huizhi-mark-logo-garden.png"
      reading_speed = 228
      frontBundle = "life"
    [[languages.en.menu.main]]
      name = "Blog"
      url = "/life/"
      weight = 1
    [[languages.en.menu.main]]
      name = "About"
      url = "/page/about/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 3

  [languages.de]
    contentDir = 'content/de'
    languageName = 'Deutsch'
    title = 'Blog von Huizhi XU'
    weight = 3
    [languages.de.params]
      brandName = "Sophia"
      introTitle = "Der Neugier folgen, ein Stück weiter."
      introSubtitle = "Notizen über Fragen, vorläufige Antworten und all die Kaninchenlöcher, die unterwegs auftauchen."
      introPhoto = "/picture.jpg"
      logo = "/huizhi-mark-logo-garden.png"
      reading_speed = 179
      frontBundle = "life"
    [[languages.de.menu.main]]
      name = "Blog"
      url = "/life/"
      weight = 1
    [[languages.de.menu.main]]
      name = "Über mich"
      url = "/page/about/"
      weight = 2
    [[languages.de.menu.main]]
      name = "Tags"
      url = "/tags/"
      weight = 3

      
[params]
  # Enable the darkmode toggle in header
  darkModeToggle = true
  
  # Enable search in header
  enableSearch = true

  # Option to customize the search parameters of a page
  # Below are the supported options; Note that including entire content
  # may slowdown the loading of search results
  # Title of page is included by default
  searchKeys = [
    "tags",
    "date",
    "categories",
    "summary",
    "content",
    "link",
  ]
  # Custom copyright - optional
  copyright = "Copyright © 2012 - Huizhi Xu · All rights reserved"
  favicon = "/huizhi-mark-logo-garden.png"

  # Color for the intro details and social links block, not applicable for dark mode
  # Supported values: Any color from TailwindCSS default colors
  # Reference: https://tailwindcss.com/docs/customizing-colors
  ascentColor = "bg-green-50"

  # The page bundle that is shown on the front page
  frontBundle = "know_how"

  featuredTags = [
    "ai",
    "llm",
    "agent",
    "rag",
    "comfyui",
    "obsidian",
    "bayesian",
    "read",
    "life",
  ]


  # Used to hide the post metadata such as posted date, reading time and word count
  # Can be used at site level or page level

  hideMeta = false
  # To hide "Other languages" option if the post is available in multiple languages
  # Can be used at site level or page level
  hideOtherLanguages = false

  # Add support for Table of contents
  # Can be added to a page level also in markdown frontmatter
  toc = true

  # Hides the thumbnail in post view
  # Thumbnails in home and blog pages will still be shown
  # This setting can also be in page's markdown file
  hidePageThumbnail = false



# Comments system
[params.comments]
  # Supports disqus, giscus and utterances
  # Check hugo docs for setting up disqus
  system = "utterances"
  repo = "HuizhiXu/huizhixu.github.io"
  issueterm = "pathname"
  theme = "preferred-color-scheme"


[params.homepage.social]
  # Global params common for both languages
  title = "Sein heißt werden, leben heißt lernen."
  description = "Der einfache Weg is immer verkehrt."

  [[params.homepage.social.icons]]
    website = "github"
    url = "https://github.com/HuizhiXu"


[[menu.main]]
  name = "主页"
  url = "/"
  weight = 1

[build]
  writeStats = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# ignoreFiles = [ "\\.qmd$", "\\.ipynb$", "\\.py$" ]

# syntax highlight settings
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      linkifyProtocol = 'https'
      strikethrough = true
      table = true
      taskList = true
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.mark]
          enable = true
      [markup.goldmark.extensions.cjk]
        eastAsianLineBreaks = false
        eastAsianLineBreaksStyle = 'simple'
        enable = false
        escapedSpace = false
      [markup.goldmark.extensions.passthrough]
        enable = false
        [markup.goldmark.extensions.passthrough.delimiters]
          block = []
          inline = []
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '&ldquo;'
        leftSingleQuote = '&lsquo;'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '&rdquo;'
        rightSingleQuote = '&rsquo;'
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = 'github'
      wrapStandAloneImageWithinParagraph = true
      [markup.goldmark.parser.attribute]
        block = false
        title = true
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'monokai'
    tabWidth = 4
